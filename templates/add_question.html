{% extends "admin_layout.html" %}
{% block content %}
<div style="color: rgb(231, 153, 44)" class="center"><h3>Add Question</h3></div>
<form action="{{ url_for('admin.add_question', cid=cid, qid=qid) }}" method="POST">
    <div class="input_form">

        <div class="mb-3">
            <label for="cid" class="form-label">Chapter Id</label>
            <input type="number" class="form-control" name="cid" id="cid" value="{{ cid }}" readonly>
        </div>

        <div class="mb-3">
            <label for="qid" class="form-label">Quiz Id</label>
            <input type="number" class="form-control" name="qid" id="qid" value="{{ qid }}" readonly>
        </div>

        <div class="mb-3">
            <label for="name" class="form-label">Question Title</label>
            <input type="text" class="form-control" name="name" id="name" placeholder="Q. Title">
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Question Description</label>
            <input type="text" class="form-control" name="description" id="description" placeholder="Description">
        </div>

        <div class="container">
            <h2>Single Option Correct</h2>
            <div class="input-group">
                <label>Option 1)</label>
                <input type="text" name="option1">
            </div>
            <div class="input-group">
                <label>Option 2)</label>
                <input type="text" name="option2">
            </div>
            <div class="input-group">
                <label>Option 3)</label>
                <input type="text" name="option3">
            </div>
            <div class="input-group">
                <label>Option 4)</label>
                <input type="text" name="option4">
            </div>
            <div class="input-group correct-option">
                <label>Correct Option:</label>
                <input type="number" name="correct_option" min="1" max="4" style="width: 50px; text-align: center;">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Submit</button>
        <a href="{{ url_for('admin.quiz') }}" class="btn btn-primary">Cancel</a>
    </div>
</form>
{% endblock %}
