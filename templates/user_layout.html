<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>User Dashboard</title>
</head>
<body class="body">
    <div class="my_container">
        <div class="my_panel">
            
            <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #1daccf; height: 60px;">
                <div class="container-fluid">
                    <a class="navbar-brand" href="{{ url_for('admin.admin_dashboard') }}">Navbar</a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Profile</a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="#">Bookings</a></li>
                        <li class="nav-item"><a class="nav-link" href="/login">Logout</a></li>
                        <li class="nav-item dropdown">
                        </li>
                    </ul>
                </div>
                <form class="d-flex">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
                </div>
            </nav>

            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
