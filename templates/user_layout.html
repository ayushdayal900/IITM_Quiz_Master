<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>User Layout</title>

   <!-- font awesome cdn link  -->
   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css">
   <!-- bootstrap link  -->
   <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
   <!-- css link  -->
   <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">

</head>
<body>

<header class="header">
   
   <!-- logo -->
   <img src="{{ url_for('static', filename='images/logo_qm.jpeg') }}" alt="logo for image" style="height: 100px; width: 160px;"></a>

   <section class="flex">

      <!-- search bar -->
      <form action="{{url_for('user.usr_search')}}" method="post" class="search-form">
         <input type="text" name="search_box" placeholder="search..." maxlength="100">
         <button type="submit" class="fas fa-search"></button>
      </form>

      <!-- icons -->
      <div class="icons" style="margin-left: 100px ;">
         <div id="menu-btn" class="fas fa-bars"></div>
         <div id="user-btn" class="fas fa-user"></div>
         <div id="toggle-btn" class="fas fa-sun"></div>
      </div>

   </section>

</header>   

<div class="side-bar">

   <div id="close-btn">
      <i class="fas fa-times"></i>
   </div>

   <div class="profile">
      
      <img src="{{ url_for('static', filename='images/profile_pic.jpg') }}" class="image" alt="">
      <h3 class="name">{{current_user.email}}</h3>
      <p class="role">student</p>
      
      <!-- this is remaining -->
      <a href="#" class="btn">view profile</a>   
   </div>

   <nav class="navbar">
      <a href="{{ url_for('user.user_dashboard') }}"><i class="fas fa-home"></i><span>Home</span></a>
      <a href="#"><i class="fas fa-question"></i><span>About</span></a>
      <a href="{{ url_for('user.subjects') }}"><i class="fa-solid fa-book-skull"></i></i><span>Subjects</span></a>
      <a href="{{ url_for('user.quizes') }}"><i class="fas fa-graduation-cap"></i><span>Quizes</span></a>
      <a href="{{ url_for('user.scores') }}"><i class="fa-solid fa-percent"></i><span>Score</span></a>
      <a href="#"><i class="fa-solid fa-rectangle-list"></i><span>Summary</span></a>
      <a href="#"><i class="fa-solid fa-user-tie"></i><span>Admin</span></a>
      <a href="#"><i class="fas fa-headset"></i><span>Contact us</span></a>
      <a href="{{ url_for('general_routes.logout') }}"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
   </nav>
</div>


{% block content %}

{% endblock %}



<!--  js link  -->
<script src="{{ url_for('static', filename='quiz.js') }}" defer></script>

   
</body>
</html>
