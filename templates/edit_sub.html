{% extends "admin_layout.html" %}   
<!-- inheritamce -->
{% block content %}

            <div class=" heading center"><h1>Edit Subject</h1></div>
            <form action="/edit_sub/{{sub.id}}" method="POST">
                <div class="input_form">

                    <div class="mb-3">
                        <label for="name" class="form-label">Subject Name</label>
                        <input type="text" class="ip form-control" name="name" id="name" value="{{sub.name}}">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="ip form-control" name="description" id="description" value="{{sub.description}}">
                    </div>

                    <button type="submit" class="inline-btn btn-primary">Submit</button>
                    <a href="{{url_for('admin.admin_dashboard')}}" type="button" class="inline-delete-btn" style="margin-left: 330px;">Cancle</a>
                </div>
            </form>
{% endblock%}
