{% extends "admin_layout.html" %}
{% block content %}

<section class="dashboard">
    <div class="box" style="max-width: 500px; margin: 2rem auto; padding: 2rem;">
        <h1 class="heading" style="text-align: center; border-bottom: none; margin-bottom: 2rem;">Add New Subject</h1>

        <form action="/add_subject" method="POST">

            <div class="form-group">
                <label for="name">Subject Name</label>
                <input type="text" name="name" id="name" class="form-control" placeholder="e.g. Mathematics" required>
            </div>

            <div class="form-group">
                <label for="description">Description (Optional)</label>
                <input type="text" name="description" id="description" class="form-control"
                    placeholder="Brief description...">
            </div>

            <div class="flex-btn" style="margin-top: 2rem;">
                <button type="submit" class="btn inline-btn" style="width: 100%;">Add Subject</button>
            </div>

            <div style="text-align: center; margin-top: 1rem;">
                <a href="{{url_for('admin.admin_dashboard')}}" style="color: var(--text-light);">Cancel</a>
            </div>

        </form>
    </div>
</section>

{% endblock%}
