{% extends "admin_layout.html" %}   
<!-- inheritamce -->
{% block content %}

            <div class="heading center"><h1>Edit Quiz</h1></div>
            
            <form action="/edit_quiz/{{quiz.id}}" method="POST">
                <div class="input_form">

                    <div class="mb-3">
                        <label for="date_time" class="form-label">Date/Time</label>
                        <input type="datetime-local" class="ip form-control" name="date_time" id="date_time" value="{{quiz.date_time}}">
                    </div>

                    <div class="mb-3">
                        <label for="duration" class="form-label">Duration</label>
                        <input type="time" class="ip form-control" name="duration" id="duration" value="{{quiz.duration}}">
                    </div>

                    <div class="mb-3">
                        <label for="score" class="form-label">Score</label>
                        <input type="number" class="ip form-control" name="score" id="score" value="{{quiz.score}}">
                    </div>

                    <button type="submit" class="inline-btn" onclick="return confirmUpdate()">Update</button>
                    <a href="{{url_for('admin.quiz')}}" type="button" class="inline-delete-btn" style="margin-left: 330px;">Cancle</a>
                </div>
            </form>
{% endblock%}
