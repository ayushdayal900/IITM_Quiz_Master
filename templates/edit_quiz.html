{% extends "admin_layout.html" %}   
<!-- inheritamce -->
{% block content %}

            <div class="center"><h3>Edit Quiz</h3></div>
            <form action="/edit_quiz/{{quiz.id}}" method="POST">
                <div class="input_form">

                    <div class="mb-3">
                        <label for="date_time" class="form-label">Date/Time</label>
                        <input type="datetime" class="form-control" name="date_time" id="date_time" placeholder="{{quiz.date_time}}">
                    </div>

                    <div class="mb-3">
                        <label for="duration" class="form-label">Duration</label>
                        <input type="time" class="form-control" name="duration" id="duration" placeholder="{{quiz.duration}}">
                    </div>

                    <div class="mb-3">
                        <label for="score" class="form-label">Score</label>
                        <input type="number" class="form-control" name="score" id="score" placeholder="{{quiz.score}}">
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a href="{{url_for('admin.admin_dashboard')}}" type="button" class="btn btn-primary">Cancle</a>
                </div>
            </form>
{% endblock%}
