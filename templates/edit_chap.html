{% extends "admin_layout.html" %}   
<!-- inheritamce -->
{% block content %}

            <div class="center"><h3>Edit Chapter</h3></div>
            <form action="/edit_chap/{{chap.id}}" method="POST">
                <div class="input_form">

                    <div class="mb-3">
                        <label for="name" class="form-label">Chapter Name</label>
                        <input type="text" class="form-control" name="name" id="name" placeholder="{{chap.name}}">
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description</label>
                        <input type="text" class="form-control" name="description" id="description" placeholder="{{chap.description}}">
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                    <a href="{{url_for('admin.admin_dashboard')}}" type="button" class="btn btn-primary">Cancle</a>
                </div>
            </form>
{% endblock%}
