<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <title>Admin Dashboard</title>
</head>
<div class="center"> <h1 style="color: rgb(231, 153, 44);">Welcome to Admin</h1></div>
<body class="body">
    <div class="my_container">
        <div class="my_panel">
            <nav class="navbar navbar-expand-lg navbar-light" style="background-color: #1daccf; height: 60px;">
                <div class="container-fluid">
                    <a class="navbar-brand" href="{{ url_for('admin.admin_dashboard') }}"><img style="height: 60px; width: 150px;" src="../static/images/logo_qm.jpeg" alt="logo image"> </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarSupportedContent">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item"><a class="nav-link active orange_text" aria-current="page" href="/admin_summary">Summary</a></li>
                            <li class="nav-item "><a class="nav-link orange_text" href="/quiz">Quizes</a></li>
                            <li class="nav-item"><a class="nav-link" href="/logout">Logout</a></li>
                    </ul>
                </div>
                <form class="d-flex" action="/search" method="POST">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name="search_txt" id="search_txt">
                    <button class="btn btn-outline-warning" type="submit">Search</button>
                </form>
            </div>
            </nav>

            {% block content %}
            {% endblock %}
        </div>
    </div>
</body>
</html>
