{% extends "index.html" %}
{% block content %}
<div class="signup-container glass">
    <div class="heading center" style="border: none; margin-bottom: 2rem;">
        <h1 style="color: var(--primary-color);">Create Account</h1>
        <p style="color: var(--text-light); font-size: 1rem;">Join Quiz Master today</p>
    </div>

    {% if msg %}
    <div class="alert alert-danger">{{ msg }}</div>
    {% endif %}

    <form action="/signup" method="POST">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="full_name">Full Name</label>
            <input type="text" name="full_name" id="full_name" class="form-control" placeholder="Enter your full name"
                required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Create a password"
                required>
        </div>

        <div class="form-group row">
            <div class="col-md-6">
                <label for="qualification">Qualification</label>
                <input type="text" name="qualification" id="qualification" class="form-control"
                    placeholder="e.g. 10th, 12th" required>
            </div>
            <div class="col-md-6">
                <label for="date">Date of Birth</label>
                <input type="date" name="date" id="date" class="form-control" required>
            </div>
        </div>

        <div class="form-group text-center mt-4">
            <button type="submit" class="btn btn-lg w-100">Sign Up</button>
        </div>

        <div class="text-center mt-3">
            <p style="color: var(--text-color);">Already have an account? <a
                    href="{{ url_for('general_routes.login') }}"
                    style="color: var(--primary-color); font-weight: 600;">Login</a></p>
        </div>
    </form>
</div>
{% endblock %}
