{% extends "admin_layout.html" %}

{% block content %}
<section class="dashboard">
  <div class="heading" style="border: none; margin-bottom: 2rem;">
    <h1>Analytics Dashboard</h1>
    <p style="color: var(--text-light);">Overview of system performance and statistics.</p>
  </div>

  <div class="grid-container">
    <!-- Subject Score Summary -->
    <div class="box">
      <h3 class="title" style="margin-bottom: 0.5rem;">Subject-Score Summary</h3>
      <p style="color: var(--text-light); margin-bottom: 1rem;">Quiz / Questions</p>
      <div style="background: var(--white); border-radius: 0.5rem; padding: 1rem; text-align: center;">
        <img src="{{ url_for('static', filename='images/subject_score_summary.jpeg') }}" class="img-fluid"
          alt="Subject-Score Summary" style="max-width: 100%; height: auto; border-radius: 0.5rem;">
      </div>
    </div>

    <!-- Quiz Questions Summary -->
    <div class="box">
      <h3 class="title" style="margin-bottom: 0.5rem;">Quiz-Questions Summary</h3>
      <p style="color: var(--text-light); margin-bottom: 1rem;">Quiz / Questions</p>
      <div style="background: var(--white); border-radius: 0.5rem; padding: 1rem; text-align: center;">
        <img src="{{ url_for('static', filename='images/quiz_summary.jpeg') }}" class="img-fluid"
          alt="Quiz-Questions Summary" style="max-width: 100%; height: auto; border-radius: 0.5rem;">
      </div>
    </div>

    <!-- Chapter Total Score Summary -->
    <div class="box">
      <h3 class="title" style="margin-bottom: 0.5rem;">Chapter-Total Score Summary</h3>
      <p style="color: var(--text-light); margin-bottom: 1rem;">Chapter / Total Score</p>
      <div style="background: var(--white); border-radius: 0.5rem; padding: 1rem; text-align: center;">
        <img src="{{ url_for('static', filename='images/chap_score_summary.jpeg') }}" class="img-fluid"
          alt="Chapter-Total Score Summary" style="max-width: 100%; height: auto; border-radius: 0.5rem;">
      </div>
    </div>
  </div>

</section>
{% endblock %}
