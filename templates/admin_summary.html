{% extends "admin_layout.html" %}

{% block content %}
<div class="container-fluid py-5">
  <div class="row">
    <div class="col-sm-12 col-md-6 col-lg-4" style="padding: 20px;">
      <div class="card shadow h-100" style="border: 2px solid #dee2e6;">
        <div class="card-body text-center" style="padding: 20px;">
          <h5 class="card-title">Subject-Score Summary</h5>
          <h6 class="card-subtitle mb-4 text-muted">Quiz/Questions</h6>
          <div style="background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
            <img 
              src="./static/images/subject_score_summary.jpeg" 
              class="img-fluid" 
              alt="Subject-Score Summary" 
              style="max-width: 100%; height: auto; display: block; margin: 0 auto;"
            >
          </div>
        </div>
      </div>
    </div>

    <div class="col-sm-12 col-md-6 col-lg-4" style="padding: 20px;">
      <div class="card shadow h-100" style="border: 2px solid #dee2e6;">
        <div class="card-body text-center" style="padding: 20px;">
          <h5 class="card-title">Quiz-Questions Summary</h5>
          <h6 class="card-subtitle mb-4 text-muted">Quiz/Questions</h6>
          <div style="background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
            <img 
              src="./static/images/quiz_summary.jpeg" 
              class="img-fluid" 
              alt="Quiz-Questions Summary" 
              style="max-width: 100%; height: auto; display: block; margin: 0 auto;"
            >
          </div>
        </div>
      </div>
    </div>

    <div class="col-sm-12 col-md-6 col-lg-4" style="padding: 20px;">
      <div class="card shadow h-100" style="border: 2px solid #dee2e6;">
        <div class="card-body text-center" style="padding: 20px;">
          <h5 class="card-title">Chapter-Total Score Summary</h5>
          <h6 class="card-subtitle mb-4 text-muted">Chapter/Total Score</h6>
          <div style="background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 15px; margin-bottom: 15px;">
            <img 
              src="./static/images/chap_score_summary.jpeg" 
              class="img-fluid" 
              alt="Chapter-Total Score Summary" 
              style="max-width: 100%; height: auto; display: block; margin: 0 auto;"
            >
          </div>
        </div>
      </div>
    </div>
  </div>

<style>
  /* Force every card to have its own space */
  .col-sm-12, .col-md-6, .col-lg-4 {
    float: left;
    clear: none;
  }
  
  /* Force images to respect boundaries */
  img {
    max-width: 100% !important;
    height: auto !important;
    object-fit: contain !important;
    margin: 0 auto !important;
    display: block !important;
  }
  
  /* Ensure each card has breathing room */
  .card {
    overflow: hidden;
    box-shadow: 0 4px 8px rgba(0,0,0,0.1) !important;
    margin-bottom: 30px !important;
  }
  
  /* Add clearfix to force proper row heights */
  .row:after {
    content: "";
    display: table;
    clear: both;
  }
  
  /* Remove fixed width on cards to make them responsive */
  .card {
    width: 100% !important;
  }
</style>
{% endblock %}
