{% extends "user_layout.html" %}
{% block content %}
<div >
    <div class="heading center"><h1>Login</h1></div>
    <form action="{{ url_for('general_routes.login') }}" method="POST">

        <div class="input_form">
            <div class="err_msg">{{msg}}</div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" name="email" id="email" placeholder="iitm@study.iitm.ac.in">
            </div>

            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" name="password" id="password" placeholder="password">
            </div>

            <div class ="center"><button type="submit" class="btn btn-primary">Login</button></div>
            <div class="center" style="margin-top:20px ; color: rgb(255, 166, 0); font-size: large;">Need an Account?<a href="/signup">Signup</a></div>
            
        </div>
    </form>
</div>
{% endblock %}
