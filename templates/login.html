{% extends "index.html" %}
{% block content %}
<div class="login-container glass">
    <div class="heading center" style="border: none; margin-bottom: 2rem;">
        <h1 style="color: var(--primary-color);">Login</h1>
        <p style="color: var(--text-light); font-size: 1rem;">Welcome back to Quiz Master</p>
    </div>

    <!-- Error message display inside the card if needed, though layout handles flashes -->
    {% if msg %}
    <div class="alert alert-danger">{{ msg }}</div>
    {% endif %}

    <form action="{{ url_for('general_routes.login') }}" method="POST">

        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password"
                required>
        </div>

        <div class="form-group text-center">
            <button type="submit" class="btn btn-lg w-100">Login</button>
        </div>

        <div class="text-center mt-3">
            <p style="color: var(--text-color);">Don't have an account? <a href="{{ url_for('general_routes.signup') }}"
                    style="color: var(--primary-color); font-weight: 600;">Sign Up</a></p>
        </div>
    </form>
</div>
{% endblock %}
