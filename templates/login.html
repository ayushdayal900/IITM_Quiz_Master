<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/styles/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    <title>Login</title>
</head>
<body>
    <div class="my_container">
        <div class="center"><h1>Heyyy New Comer....</h1></div>
        <div class="my_panel">
            <div class="center"><h3>Login</h3></div>
            <form action="/login" method="POST">
                <div class="input_form">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" id="email" placeholder="iitm@study.iitm.ac.in">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="password" placeholder="password">
                    </div>

                    <div class ="center"><button type="submit" class="btn btn-primary">Login</button></div>
                    Need and Account?<a href="/signup">Signup</a>
                    <div class="err_msg">{{msg}}</div>
                </div>
            </form>
        </div>

    </div>
</body>
</html>
